name: Lint

on:
  push:
  pull_request:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install flake8
      # Configured in .flake8: defect checks only, no formatting rules.
      # The examples import board-only modules, so this lints for real
      # mistakes (undefined names, unused imports) without importing.
      - run: python -m flake8
